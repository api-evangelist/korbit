  /v2/openOrders:
    get:
      operationId: getOpenOrders
      summary: Get Open Orders
      description: Query the list of open orders for a single trading pair. Only orders with the status
        `open` or `partiallyFilled` are queried.
      tags:
      - Trading
      parameters:
      - name: symbol
        in: query
        required: true
        description: Trading pair.
        schema:
          type: string
          examples:
          - btc_krw
