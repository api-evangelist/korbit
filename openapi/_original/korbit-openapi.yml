      security:
      - KorbitApiKey: []
      x-korbit-permission: readOrders
    post:
      operationId: createOrders
      summary: Place Order
      description: Place a new order.
      tags:
      - Trading
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                  description: Trading pair.
                  examples:
                  - btc_krw
                accountSeq:
                  type: number
                  description: Account sequence number. Defaults to 1 (main account).
                  examples:
                  - 1
                side:
                  type: string
                  enum:
                  - buy
                  - sell
                price:
                  type: string
                  description: order price for a limit order. omit for a market/BBO order.
                  examples:
                  - '250000'
                qty:
                  type: string
                  description: order quantity for a limit order and a market/BBO sell order. omit for
                    a market/BBO buy order.
                  examples:
                  - '10'
                amt:
                  type: string
                  description: order amount (purchase amount) for a market/BBO buy order. omit for a limit
                    order and a market/BBO sell order.
                  examples:
                  - '250000'
                orderType:
                  type: string
                  enum:
                  - limit
                  - market
                  - best
                  description: '`limit` — limit order / `market` — market order / `best` — best bid/offer.
                    The `timeInForce` and `bestNth` parameters must be set.'
                bestNth:
                  type: number
                  description: 'Selects the order''s price when orderType=`best`. For other types, this
                    parameter must be omitted. - when timeInForce is one of `gtc`,`ioc`,`fok`: Opponent
                    N price level where N is 1 ~ 5. - when timeInForce is `po`: Queue N price level where
                    N is 1 ~ 5.'
                  examples:
                  - 1
                timeInForce:
                  type: string
                  enum:
                  - gtc
                  - ioc
                  - fok
                  - po
                  description: 'Time in Force strategies. Default: - limit order: `gtc` - market order:
                    `ioc` - best bid/offer: no default(Bad Request error if omitted) For market orders,
                    only `ioc` can be entered. `gtc` — Good-Till-Canceled. The order will remain valid
                    until terminated (fully executed or canceled) / `ioc` — Immediate-Or-Cancel. The order
                    will be filled immediately, if can not then will be canceled. (Taker-Only) / `fok`
                    — Fill-Or-Kill. The order will be filled fully, if can not then will be canceled.
                    (Taker-Only) / `po` — Post-Only. If the order would be filled immediately, then will
                    be canceled. (Maker-Only)'
                clientOrderId:
                  type: string
                  description: 'User-defined order ID. Even if multiple requests are made with the same
                    `clientOrderId`, it will be processed only once. You can search for the order using
                    `clientOrderId` with the `GET /v2/orders`. Only strings matching the following regex
                    pattern are allowed: `[0-9a-zA-Z.:_-]{1,36}` However, orders with the statuses `expired`
                    or `canceled` cannot be searched by `clientOrderId` or same `clientOrderId` can be
                    reused approximately three days after they have been closed.'
                  examples:
                  - 20141231-155959-abcdef
                pp:
                  type: string
                  description: Price protection. Set to `true` to enable the price protection feature.
                    This order will only be executed within the price protection range when matched as
                    a taker. Use the `ppPercent` parameter to change the threshold.
                ppPercent:
                  type: string
                  description: Threshold(in percent) for the price protection feature. Set an integer
                    between 1 and 100. If the price protection threshold is set to 5, this order will
                    only be executed within 5% of the midpoint price (between the best ask and best bid)
                    when matched as a taker order. Any unfilled quantity will be canceled. If you enable
                    price protection but do not set ppPercent, the default (5) will be used.
              required:
              - symbol
              - side
              - orderType
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                    - true
                  data:
                    type: object
                    properties:
                      orderId:
                        type: number
                        description: order ID.
                        examples:
                        - 1234
                    required:
                    - orderId
                required:
                - success
              example:
                success: true
                data:
                  orderId: 1234
        '400':
          description: Bad request — see the error envelope and error codes.
          content:
