        description: Account sequence number. Defaults to 1 (main account).
        schema:
          type: number
          examples:
          - 1
      - name: limit
        in: query
        description: 'Number of queries (range: 1 to 1000). Default is 500.'
        schema:
          type: number
          examples:
          - 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                    - true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        orderId:
                          type: number
                          description: Order ID generated by the server.
                          examples:
                          - 1234
                        clientOrderId:
                          type: string
                          description: '`clientOrderId` submitted from the user by POST /v2/orders.'
                          examples:
                          - 20141231-155959-abcdef
                        orderType:
                          type: string
                          enum:
                          - limit
                          - market
                          - best
                          description: '`limit` — limit order / `market` — market order / `best` — best
                            bid/offer'
                        side:
                          type: string
                          enum:
                          - buy
                          - sell
                        price:
                          type: string
                          description: Order price (limit/BBO order only. no price for market order. For
                            BBO orders it's set after the price is determined).
                          examples:
                          - '5000'
                        qty:
                          type: string
                          description: Order quantity (limit/BBO order or sell-side market order only.
                            For BBO orders it's set after the quantity is determined).
                          examples:
                          - '10'
                        amt:
                          type: string
                          description: Purchase amount in counter/quote asset like KRW. (buy-side market/BBO
                            order only).
                          examples:
                          - '50000'
                        filledQty:
                          type: string
                          description: Filled quantity.
                          examples:
                          - '10'
                        filledAmt:
                          type: string
                          description: Filled amount in counter/quote asset like KRW.
                          examples:
                          - '50000'
                        avgPrice:
                          type: string
                          description: Average execution price.
                          examples:
                          - '5000'
                        createdAt:
                          type: number
                          description: Order timestamp (ms).
                          examples:
                          - 1700000000000
                        lastFilledAt:
                          type: number
                          description: Last execution timestamp (ms).
                          examples:
                          - 1700000000000
                        status:
                          type: string
                          enum:
                          - pending
                          - open
                          - filled
                          - canceled
                          - partiallyFilled
                          - partiallyFilledCanceled
                          - expired
                          description: Order status `pending` — Order pending. When the balance is insufficient
                            or timeInForce condition is triggered, the order may fail and change to the
                            `expired` status. / `open` — Fully unfilled / `filled` — Execution closed.
                            An order whose unfilled remainder is returned instead of resting on the book
                            (e.g. an `ioc` order, or a price-protected (`pp`) order trimmed by the protection
                            range) also closes as `filled` even when less than the requested quantity
                            executed. Confirm the executed amount with `filledQty`/`filledAmt`. / `canceled`
                            — Fully canceled / `partiallyFilled` — Partially filled / `partiallyFilledCanceled`
                            — Partially filled and remaining amount canceled / `expired` — Order submission
                            failed (due to insufficient balance or timeInForce conditions)
                      required:
                      - orderId
                      - orderType
                      - side
                      - filledQty
                      - filledAmt
                      - createdAt
                      - status
                required:
                - success
              example:
                success: true
                data:
                - orderId: 1234
                  orderType: limit
                  side: buy
                  avgPrice: '5000'
                  price: '5000'
                  qty: '10'
                  filledQty: '1'
                  filledAmt: '5000'
                  createdAt: 1700000000000
                  lastFilledAt: 1700000000000
                  status: partiallyFilled
                - orderId: 1235
                  orderType: limit
                  side: sell
                  price: '5000'
                  qty: '10'
                  filledQty: '0'
                  filledAmt: '0'
                  createdAt: 1700000000000
                  status: open
        '400':
          description: Bad request — see the error envelope and error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API key / signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: API key lacks the required permission or the IP is not allowlisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded. Honor `Retry-After` / the `Ratelimit` reset window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
