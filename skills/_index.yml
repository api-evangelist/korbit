cross_cutting_rules:
- Sign against Korbit's server clock (getTime), never the host clock — the accepted window is
  asymmetric and a fast clock fails every signed request.
- Order placement is idempotent only via a persisted clientOrderId; withdrawals have no idempotency
  key and must never be auto-retried.
- Never infer execution from order status — read filledQty/filledAmt.
- Order and trade history is capped at 36 hours; keep your own durable record.
- Develop against the local sandbox before touching production.
- Never log the API secret, private key or request signature.
