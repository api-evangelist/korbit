- aid: korbit:korbit-open-api-v2-websocket
  name: Korbit Open API v2 WebSocket
  description: >-
    WebSocket streaming API for the Korbit exchange. Public channels stream ticker, orderbook and trade
    market data; private channels stream the authenticated account's order, trade and balance changes.
    Private connections sign exactly like REST, with timestamp and signature in the query string and X-KAPI-KEY
    in the connection header.
  humanURL: https://docs.korbit.co.kr/
