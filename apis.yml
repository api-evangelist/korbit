aid: korbit
name: Korbit
description: 'Korbit is South Korea''s first cryptocurrency exchange, founded in 2013 and headquartered
  in Seoul, offering KRW-denominated spot trading of bitcoin, ether and other digital assets to Korean
  retail and institutional customers. Korbit publishes the Korbit Open API v2, a REST and WebSocket
  interface covering market data (tickers, orderbook, trades, candlesticks, tick-size policy), order
  placement and cancellation, order and trade history, balances, cryptocurrency deposit-address
  management and withdrawals, and KRW deposit/withdrawal push notifications. Authentication is by API
  key (X-KAPI-KEY) with per-request HMAC-SHA256 or ED25519 signatures, granular key permissions and
  optional IP allowlisting. Korbit is unusually agent-forward for an exchange: it ships an official Go
  CLI with a bundled MCP server and Agent Skill, a documented llms.txt, and a downloadable local
  sandbox that mocks the full REST and WebSocket surface for no-risk development.'
