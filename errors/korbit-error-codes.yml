websocket_errors:
  note: >-
    WebSocket control messages carry a `status` field; data messages do not. Failures look like
    {"requestId": 1, "status": "fail", "code": "INVALID_SYMBOL", "message": "..."} or
    {"status": "error", "message": "..."}.
  codes:
  - code: INVALID_SYMBOL
    context: subscribe control message
order_statuses:
  note: >-
    Not errors, but the status values a client must handle to know whether an order succeeded.
  values:
  - value: pending
    meaning: >-
      Order pending. When the balance is insufficient or a timeInForce condition is triggered, the
      order may fail and change to `expired`.
  - value: open
    meaning: Fully unfilled.
  - value: filled
    meaning: >-
      Execution closed. An order whose unfilled remainder is returned instead of resting on the book
      (e.g. an `ioc` order, or a price-protected order trimmed by the protection range) also closes
      as `filled` even when less than the requested quantity executed — confirm with
      filledQty/filledAmt.
  - value: canceled
    meaning: Fully canceled.
  - value: partiallyFilled
    meaning: Partially filled.
  - value: partiallyFilledCanceled
    meaning: Partially filled and remaining amount canceled.
  - value: expired
    meaning: Order submission failed (insufficient balance or timeInForce conditions).
sandbox_only:
  note: Emitted by the local sandbox mock only; never returned by production.
  codes:
  - code: SANDBOX_MARKET_DATA_UNAVAILABLE
    http_status: 503
    meaning: A live-mirrored pair has no data yet. Retry shortly.
related:
  conventions: conventions/korbit-conventions.yml
