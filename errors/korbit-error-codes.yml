generated: '2026-07-19'
method: searched
source: https://docs.korbit.co.kr/llms/en/rest_api.md
docs: https://docs.korbit.co.kr/
format: symbolic-string-codes
rfc9457: false
description: >-
  Korbit does not use RFC 9457 problem+json. Errors are returned in the standard response envelope
  with a symbolic string code carried on `error.message`. This catalog is the full published error
  reference, cross-checked against the per-operation error lists in the generated OpenAPI.
envelope:
  shape: '{"success": false, "error": {"message": "<CODE>"}}'
  code_field: error.message
  content_type: application/json
transient_codes:
  description: >-
    Codes and conditions Korbit documents as safe to retry with backoff. Everything else should be
    treated as terminal for that request.
  codes:
  - TRY_AGAIN
  http_conditions:
  - No HTTP status (network failure)
  - 429
  - 5xx
  caution: >-
    A network timeout on order placement does not tell you whether the order was placed. Never
    blindly resend a placement — reconcile via clientOrderId first. See
    conventions/korbit-conventions.yml.
errors:
- code: BAD_REQUEST
  message: Bad request.
  operations: [createOrders]
  paths: ['POST /v2/orders']
  area: trading
- code: CANNOT_CANCEL_WITHDRAWAL
  message: The withdrawal cannot be canceled (likely because it's being processed).
  operations: [deleteCoinWithdrawal]
  paths: ['DELETE /v2/coin/withdrawal']
  area: withdrawal
- code: DAILY_LIMIT_EXCEEDED
  message: You have exceeded the daily withdrawal limit.
  operations: [createCoinWithdrawal]
  paths: ['POST /v2/coin/withdrawal']
  area: withdrawal
- code: DUPLICATE_CLIENT_ORDER_ID
  message: Request rejected due to duplicate clientOrderId.
  operations: [createOrders]
  paths: ['POST /v2/orders']
  area: trading
  remediation: >-
    Treat as success — a prior attempt already registered this order. Look it up with GET /v2/orders
    by clientOrderId instead of resending.
- code: EXCEED_TIME_WINDOW
  message: The request timestamp fell outside the accepted signing window.
  operations: []
  paths: [any signed request]
  area: authentication
  remediation: >-
    Sign against Korbit's server clock from GET /v2/time. The window is asymmetric — raising
    recvWindow cannot help a clock that is ahead of the server.
- code: FORBIDDEN_WITHDRAWAL_ADDRESS
  message: Withdrawals to the address is forbidden due to policy.
  operations: [createCoinWithdrawal]
  paths: ['POST /v2/coin/withdrawal']
  area: withdrawal
- code: INVALID_CURRENCY
